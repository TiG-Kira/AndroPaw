org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AndroPaw: org.gradle.java.home 不再写死本机路径 —— 原来指向
# "C:/Program Files/Android/Android Studio/jbr"，在 CI（Linux）和任何没装 Android Studio
# 的机器上都会直接让 Gradle 启动失败。改为使用 JAVA_HOME / PATH 上的 JDK；
# 若本机需要固定 JDK，请写进 ~/.gradle/gradle.properties（不入库）。
